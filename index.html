<html>
    <head>
        <title>Tiendita</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light mt-5">

        <div class="container">
            <div class="row g-4">
                
                <!-- Formulario de Registro -->
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white font-weight-bold fw-bold">
                            <i class="me-1 text-primary"></i> Registrar Producto
                        </div>
                        <div class="card-body">
                            <form id="formProducto">
                                <div class="mb-3">
                                   
                                    <label for="nombre" class="form-label">Nombre del Producto</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Leche 1L" required>
                                </div>
                                <div class="mb-3">
                                    <label for="precio" class="form-label">Precio ($)</label>
                                    <input type="number" step="0.5" class="form-control" id="precio" placeholder="25.00" required>
                                </div>
                                <div class="mb-3">
                                    <label for="cantidad" class="form-label">Cantidad Disponible</label>
                                    <input type="number" class="form-control" id="cantidad" placeholder="10" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-save me-1"></i> Guardar Producto
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Inventario -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                            <span><i class="me-1 text-primary"></i> Catálogo de Productos</span>
                            <span class="badge bg-secondary" id="totalProductos">0 productos</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                            <th class="text-end me-3">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaProductos">
                                        <!-- Las filas se cargan dinámicamente con JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
